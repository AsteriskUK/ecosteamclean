# Netlify configuration — EcoSteam Clean (static site, no build step)

[build]
  publish = "."

# Production security headers (not possible on GitHub Pages)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
